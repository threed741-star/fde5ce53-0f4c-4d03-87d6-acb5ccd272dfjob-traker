<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>কাস্টমার জব ট্র্যাকার</title>
<style>
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#1d2433; --muted:#667085; --line:#d9dee7;
    --brand:#1f4fd8; --brand-d:#173ba6; --ok:#12805c; --warn:#b54708; --bad:#c0262d;
    --warn-bg:#fff1e0; --bad-bg:#fde8e8; --ok-bg:#e3f5ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;font-size:16px;line-height:1.5}
  header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  header h1{margin:0;font-size:22px;font-weight:600}
  #conn{font-size:13px;opacity:.85}
  main{max-width:1050px;margin:0 auto;padding:20px;display:grid;gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
  .card h2{margin:0;font-size:18px}
  .count{color:var(--muted);font-weight:400;font-size:15px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .search{max-width:280px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
  input,textarea{font:inherit;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .full{grid-column:1/-1}
  textarea{min-height:110px;resize:vertical}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid transparent;padding:9px 16px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .primary{background:var(--brand);color:#fff}
  .primary:hover:not(:disabled){background:var(--brand-d)}
  .done{background:var(--ok);color:#fff}
  .ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .danger{background:#fff;border-color:var(--bad);color:var(--bad)}
  .danger.solid{background:var(--bad);color:#fff}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:520px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:14px;color:var(--muted);font-weight:500}
  .serial{background:var(--brand);color:#fff;min-width:44px;padding:5px 10px;font-weight:600}
  .serial:hover{background:var(--brand-d)}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px}
  .tag.late{background:var(--bad-bg);color:var(--bad)}
  .tag.soon{background:var(--warn-bg);color:var(--warn)}
  .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .empty{color:var(--muted);padding:14px 8px}
  .pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px;color:var(--muted);font-size:15px}
  .pager button{padding:6px 14px}
  dialog{border:none;border-radius:12px;padding:0;width:min(520px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(20,26,40,.55)}
  .dlg{padding:20px;display:grid;gap:12px}
  .dlg h3{margin:0;font-size:20px}
  .row{display:grid;grid-template-columns:130px 1fr;gap:8px}
  .row b{color:var(--muted);font-weight:500}
  .details{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:6px}
  .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:50;max-width:90vw}
  #toast.err{background:var(--bad)}
  @media(max-width:600px){form{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:0}.search{max-width:none;width:100%}}
</style>
</head>
<body>
<header><h1>কাস্টমার জব ট্র্যাকার</h1><span id="conn">সংযোগ হচ্ছে...</span></header>
<main>

  <section class="card">
    <h2>নতুন জব তৈরি করুন</h2>
    <form id="jobForm">
      <label>কাস্টমারের নাম
        <input id="name" required placeholder="যেমন: রহিম">
      </label>
      <label>ফোন নম্বর
        <input id="phone" type="tel" required placeholder="01XXXXXXXXX">
      </label>
      <label>ফেব্রিক
        <input id="fabric" required placeholder="যেমন: পলি মেশ">
      </label>
      <label>ডেলিভারি তারিখ
        <input id="date" type="date" required>
      </label>
      <label class="full">বিস্তারিত (যা মনে রাখতে হবে)
        <textarea id="details" placeholder="সাইজ, রং, ডিজাইন, দাম, বিশেষ কথা..."></textarea>
      </label>
      <div class="full"><button class="primary" id="saveBtn" type="submit">জব সেভ করুন</button></div>
    </form>
  </section>

  <section class="card">
    <div class="head">
      <h2>চলমান কাজ <span class="count" id="pendingCount"></span></h2>
      <input class="search" id="qPending" type="search" placeholder="নাম, ফোন বা সিরিয়াল দিয়ে খুঁজুন">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>সিরিয়াল</th><th>কাস্টমার</th><th>ডেলিভারি তারিখ</th><th>অবস্থা</th></tr></thead>
        <tbody id="pendingBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pendingPager"></div>
  </section>

  <section class="card">
    <div class="head">
      <h2>ডেলিভারি সম্পন্ন <span class="count" id="doneCount"></span></h2>
      <input class="search" id="qDone" type="search" placeholder="নাম, ফোন বা সিরিয়াল দিয়ে খুঁজুন">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>সিরিয়াল</th><th>কাস্টমার</th><th>ফোন</th><th>ফেব্রিক</th><th>ডেলিভারি তারিখ</th><th>সম্পন্ন হয়েছে</th><th>বিস্তারিত</th><th></th></tr></thead>
        <tbody id="doneBody"></tbody>
      </table>
    </div>
    <div class="pager" id="donePager"></div>
  </section>
</main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="cdlg">
  <div class="dlg">
    <h3 id="cTitle">আপনি কি নিশ্চিত?</h3>
    <div id="cMsg"></div>
    <div class="actions">
      <button class="ghost" id="cNo">না</button>
      <button class="primary" id="cYes">হ্যাঁ, নিশ্চিত</button>
    </div>
  </div>
</dialog>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, runTransaction, updateDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAav05R9dyyuNVpM5-ElkGA0e4nSgG0l1o",
  authDomain: "deliverdata.firebaseapp.com",
  projectId: "deliverdata",
  storageBucket: "deliverdata.firebasestorage.app",
  messagingSenderId: "586825722772",
  appId: "1:586825722772:web:b3585aa53bd20ed48cbd81",
  measurementId: "G-V8F9TW141H"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const PER_PAGE = 20;

let jobs = [];
const view = { pending:{page:1,q:""}, done:{page:1,q:""} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, isErr){
  const t = $("toast");
  t.textContent = msg; t.className = isErr ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3500);
}

/* ---------- confirm popup ---------- */
function confirmBox(message, yesLabel, danger){
  return new Promise(resolve => {
    $("cMsg").textContent = message;
    const yes = $("cYes"), no = $("cNo");
    yes.textContent = yesLabel || "হ্যাঁ, নিশ্চিত";
    yes.className = danger ? "danger solid" : "primary";
    const finish = v => { yes.onclick = no.onclick = null; $("cdlg").close(); resolve(v); };
    yes.onclick = () => finish(true);
    no.onclick = () => finish(false);
    $("cdlg").oncancel = () => { finish(false); };
    $("cdlg").showModal();
  });
}

/* ---------- date helpers ---------- */
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysLeft(s){ const p = s.split("-"); return Math.round((new Date(+p[0],+p[1]-1,+p[2]) - today())/86400000); }
function fmt(s){ const p = s.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function status(s){
  const n = daysLeft(s);
  if(n < 0) return `<span class="tag late">${-n} দিন দেরি</span>`;
  if(n === 0) return `<span class="tag soon">আজই ডেলিভারি</span>`;
  if(n === 1) return `<span class="tag soon">আগামীকাল</span>`;
  if(n <= 3) return `<span class="tag soon">${n} দিন বাকি</span>`;
  return `<span class="tag ok">${n} দিন বাকি</span>`;
}

/* ---------- search + pagination ---------- */
function matches(j, q){
  if(!q) return true;
  q = q.toLowerCase().trim().replace(/^#/, "");
  return j.name.toLowerCase().includes(q) || String(j.phone).toLowerCase().includes(q) || String(j.id) === q;
}
function paginate(list, key){
  const v = view[key];
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if(v.page > pages) v.page = pages;
  const start = (v.page - 1) * PER_PAGE;
  return { items: list.slice(start, start + PER_PAGE), pages, page: v.page, total: list.length };
}
function pagerHtml(p){
  if(p.pages <= 1) return "";
  return `<button class="ghost" data-pg="-1" ${p.page<=1?"disabled":""}>আগের পাতা</button>
          <span>পাতা ${p.page} / ${p.pages}</span>
          <button class="ghost" data-pg="1" ${p.page>=p.pages?"disabled":""}>পরের পাতা</button>`;
}

function render(){
  const pendingAll = jobs.filter(j => !j.done).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);
  const doneAll = jobs.filter(j => j.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));

  const pf = pendingAll.filter(j => matches(j, view.pending.q));
  const df = doneAll.filter(j => matches(j, view.done.q));
  const pp = paginate(pf, "pending");
  const dp = paginate(df, "done");

  $("pendingCount").textContent = `(${pendingAll.length}টি)`;
  $("doneCount").textContent = `(${doneAll.length}টি)`;

  $("pendingBody").innerHTML = pp.items.length ? pp.items.map(j =>
    `<tr><td><button class="serial" data-open="${j.id}" aria-label="জব ${j.id} দেখুন">#${j.id}</button></td>
     <td>${esc(j.name)}</td><td>${fmt(j.date)}</td><td>${status(j.date)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">${view.pending.q ? "কিছু পাওয়া যায়নি।" : "কোনো চলমান কাজ নেই। উপরে নতুন জব যোগ করুন।"}</td></tr>`;

  $("doneBody").innerHTML = dp.items.length ? dp.items.map(j =>
    `<tr><td>#${j.id}</td><td>${esc(j.name)}</td><td>${esc(j.phone)}</td><td>${esc(j.fabric)}</td>
     <td>${fmt(j.date)}</td><td>${j.doneAt ? new Date(j.doneAt).toLocaleDateString("en-GB") : ""}</td>
     <td style="white-space:pre-wrap">${esc(j.details)}</td>
     <td><button class="ghost" data-undo="${j.id}">ফিরিয়ে আনুন</button></td></tr>`).join("")
    : `<tr><td colspan="8" class="empty">${view.done.q ? "কিছু পাওয়া যায়নি।" : "এখনো কোনো ডেলিভারি সম্পন্ন হয়নি।"}</td></tr>`;

  $("pendingPager").innerHTML = pagerHtml(pp);
  $("donePager").innerHTML = pagerHtml(dp);
}

/* ---------- detail popup ---------- */
function openJob(id){
  const j = jobs.find(x => x.id === id); if(!j) return;
  $("dlgBody").innerHTML = `
    <h3>জব #${j.id} — ${esc(j.name)}</h3>
    <div class="row"><b>ফোন নম্বর</b><span>${esc(j.phone)}</span></div>
    <div class="row"><b>ফেব্রিক</b><span>${esc(j.fabric)}</span></div>
    <div class="row"><b>ডেলিভারি তারিখ</b><span>${fmt(j.date)} ${status(j.date)}</span></div>
    <div class="row"><b>বিস্তারিত</b><div class="details">${esc(j.details) || "—"}</div></div>
    <div class="actions">
      <button class="danger" data-del="${j.id}">মুছে ফেলুন</button>
      <button class="ghost" data-close>বন্ধ করুন</button>
      <button class="done" data-done="${j.id}">ডেলিভারি সম্পন্ন</button>
    </div>`;
  $("dlg").showModal();
}

/* ---------- Firebase actions ---------- */
async function addJob(data){
  const metaRef = doc(db, "meta", "counter");
  await runTransaction(db, async tx => {
    const snap = await tx.get(metaRef);
    const n = snap.exists() ? snap.data().next : 1;
    tx.set(metaRef, { next: n + 1 });
    tx.set(doc(db, "jobs", String(n)), { ...data, id: n, done: false, createdAt: Date.now() });
  });
}

$("jobForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!await confirmBox("এই জবটি সেভ করবেন?", "হ্যাঁ, সেভ করুন")) return;
  const btn = $("saveBtn"); btn.disabled = true;
  try{
    await addJob({
      name: $("name").value.trim(),
      phone: $("phone").value.trim(),
      fabric: $("fabric").value.trim(),
      date: $("date").value,
      details: $("details").value.trim()
    });
    $("jobForm").reset(); $("name").focus();
    toast("জব সেভ হয়েছে");
  }catch(err){
    console.error(err); toast("সেভ হয়নি: " + (err.code || err.message), true);
  }finally{ btn.disabled = false; }
});

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if(!t) return;
  try{
    if(t.dataset.open) openJob(+t.dataset.open);
    else if(t.hasAttribute("data-close")) $("dlg").close();
    else if(t.dataset.done){
      const id = t.dataset.done;
      if(await confirmBox(`জব #${id} কি ডেলিভারি সম্পন্ন হিসেবে চিহ্নিত করবেন?`, "হ্যাঁ, সম্পন্ন")){
        await updateDoc(doc(db, "jobs", id), { done: true, doneAt: Date.now() });
        $("dlg").close(); toast("ডেলিভারি সম্পন্ন হয়েছে");
      }
    }
    else if(t.dataset.del){
      const id = t.dataset.del;
      if(await confirmBox(`জব #${id} মুছে ফেললে আর ফিরে পাওয়া যাবে না। নিশ্চিত?`, "হ্যাঁ, মুছুন", true)){
        await deleteDoc(doc(db, "jobs", id));
        $("dlg").close(); toast("জব মুছে ফেলা হয়েছে");
      }
    }
    else if(t.dataset.undo){
      const id = t.dataset.undo;
      if(await confirmBox(`জব #${id} কি আবার চলমান কাজে ফিরিয়ে আনবেন?`, "হ্যাঁ, ফিরিয়ে আনুন")){
        await updateDoc(doc(db, "jobs", id), { done: false, doneAt: null });
        toast("চলমান কাজে ফিরিয়ে আনা হয়েছে");
      }
    }
    else if(t.dataset.pg){
      const key = t.closest("#pendingPager") ? "pending" : "done";
      view[key].page += +t.dataset.pg; render();
    }
  }catch(err){
    console.error(err); toast("কাজটি হয়নি: " + (err.code || err.message), true);
  }
});

$("qPending").addEventListener("input", e => { view.pending.q = e.target.value; view.pending.page = 1; render(); });
$("qDone").addEventListener("input", e => { view.done.q = e.target.value; view.done.page = 1; render(); });
$("dlg").addEventListener("click", e => { if(e.target === $("dlg")) $("dlg").close(); });

/* ---------- live data ---------- */
onSnapshot(collection(db, "jobs"), snap => {
  jobs = snap.docs.map(d => d.data()).filter(j => j && j.id != null);
  $("conn").textContent = "অনলাইন ✓";
  render();
}, err => {
  console.error(err);
  $("conn").textContent = "সংযোগ ব্যর্থ";
  toast("ডাটা লোড হয়নি: " + (err.code || err.message), true);
});

render();
</script>
</body>
</html>
